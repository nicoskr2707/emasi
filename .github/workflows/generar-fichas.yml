# Regenera las fichas estáticas, el sitemap y el índice de fichas
# cada vez que se sube un propiedades.csv nuevo (o a mano desde la pestaña Actions).
name: Generar fichas de propiedades

on:
  push:
    branches: [main]
    paths:
      - propiedades.csv
      - propiedad.html
      - scripts/generar_fichas.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generar-fichas
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar fichas
        run: python3 scripts/generar_fichas.py

      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A propiedades assets/data/fichas.json sitemap.xml propiedades.html
          git commit -m "Actualizar fichas de propiedades"
          git push
